<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<title>GymLog — дневник тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>

  <!-- Таймер отдыха -->
  <div id="restbar" class="restbar hidden" role="timer">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/>
    </svg>
    <div class="restbar-info">
      <span class="restbar-label">Отдых</span>
      <span class="restbar-time" id="rest-time">1:30</span>
    </div>
    <button class="btn btn-ghost btn-sm" data-action="rest-plus">+30с</button>
    <button class="btn btn-ghost btn-sm" data-action="rest-stop" aria-label="Остановить таймер">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <nav id="tabbar" aria-label="Основная навигация">
    <button class="tab active" data-action="nav" data-view="calendar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/>
      </svg>
      <span>Календарь</span>
    </button>
    <button class="tab" data-action="nav" data-view="week">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>
      </svg>
      <span>Тренировка</span>
    </button>
    <button class="tab" data-action="nav" data-view="stats">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/>
      </svg>
      <span>Прогресс</span>
    </button>
    <button class="tab" data-action="nav" data-view="plan">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
      </svg>
      <span>План</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
